# Bootstrap administration uses the image's named postgres OS identity locally.
local all postgres peer
local all all scram-sha-256
# Reject plaintext network sessions and network login for the named postgres role.
# Audit restored roles separately; HBA does not match arbitrary superuser privilege.
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl all postgres 0.0.0.0/0 reject
hostssl all postgres ::/0 reject
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
